services:
  backend:
    environment:
      ANALYTICS_DATABASE_URL: ""
      ANALYTICS_PGHOST: 127.0.0.1
      ANALYTICS_PGPORT: "5432"
      ANALYTICS_PGUSER: chatbot_analytics_runtime
      ANALYTICS_PGPASSWORD: ${ANALYTICS_DB_PASSWORD:?Задайте пароль роли аналитики}
      ANALYTICS_PGDATABASE: chatbot_storage
      ANALYTICS_SYNC_ENABLED: "${ANALYTICS_SYNC_ENABLED:-false}"
      ANALYTICS_SQL_FUNNEL_ENABLED: "${ANALYTICS_SQL_READ_ENABLED:-false}"
      ANALYTICS_SQL_ACTIVITY_ENABLED: "${ANALYTICS_SQL_READ_ENABLED:-false}"
      ANALYTICS_SQL_QUESTIONS_ENABLED: "${ANALYTICS_SQL_READ_ENABLED:-false}"
      ANALYTICS_SQL_OPERATORS_ENABLED: "${ANALYTICS_SQL_READ_ENABLED:-false}"
      ANALYTICS_SQL_SUMMARY_ENABLED: "${ANALYTICS_SQL_READ_ENABLED:-false}"
