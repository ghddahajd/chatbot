services:
  backend:
    build:
      context: ./backend
    container_name: chat-widget-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RAG_CHUNKS_FILE: /client-input/normalized/rosh_articles/crawl/chunks.corpus.jsonl
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
      - ./widget:/app/widget
      - ./demo:/app/demo
      - ./client-input:/client-input:ro
