    - "self_harm"
    - "illegal_requests"
    - "prompt_injection"
  escalation_policy:
    unknown_service: "clarify_or_operator"
    complaint: "operator"
    custom_price: "operator"
    booking: "lead_then_operator"
clinic_info:
  doctors: []
  facts:
    oms: false
    ambulance_brings: false
    sells_products: false
    discloses_doctor_schedule: false
