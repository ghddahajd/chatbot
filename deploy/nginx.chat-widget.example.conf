# пример reverse proxy для chat-widget backend
#
# заменить:
# - chat.example.com на свой домен
# - пути к ssl_certificate / ssl_certificate_key
# - upstream, если backend не на 127.0.0.1:8000
#
# ВАЖНО (аудит §2026-08-22): limit_req_zone ниже нельзя просто раскомментировать в этом
# файле — эта директива обязана быть в http{} блоке ГЛАВНОГО /etc/nginx/nginx.conf (сайт-конфиг
# в sites-available/sites-enabled уже подключается ВНУТРИ http{}, ещё один вложенный http{}
# невалиден). Добавить строку ниже в nginx.conf вручную одной строкой внутри http { ... }:
#
#   limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=2r/s;
#
# 2r/s с запасом (не жёстче) app-уровня — там уже есть свой rate-limit 30/мин на IP
# (CHAT_RATE_LIMIT_PER_MINUTE), nginx тут только грубый первый рубеж до самого приложения,
# не замена ему.

server {
    listen 80;
    server_name chat.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name chat.example.com;

    ssl_certificate /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;

    client_max_body_size 1m;

    # Базовые security-заголовки (аудит §2026-08-22) — раньше их не было вообще, вся защита
    # была только на уровне приложения.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Токен оператора приходит ТОЛЬКО через query string у этих путей (браузерная навигация
    # на страницу и WebSocket API — ни там, ни там нельзя выставить кастомный заголовок), а не
    # через заголовок X-Operator-Token, как остальные /api/operator/* и /api/debug/* эндпоинты.
    # Дефолтный access_log nginx пишет полную строку запроса, query string включая — без
    # access_log off токен оператора осел бы в файле лога на диске сервера открытым текстом на
    # каждый вход. /debug и /debug/rag — тот же самый verify_operator_token(request, None) с
    # чтением ?token= (см. app/routes/debug.py), поэтому та же дыра и то же лечение, что у
    # /operator. /api/operator/* и /api/debug/* сюда не входят — там токен в заголовке, в лог
    # запроса заголовки не попадают, эти пути логируются как обычно.
    location = /operator {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /debug {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /debug/rag {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/operator {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        # limit_req_zone chat_limit объявлена в http{} nginx.conf, см. комментарий вверху файла.
        limit_req zone=chat_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
