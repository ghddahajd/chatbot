    enabled: false
    chat_id: ""
    events:
      - lead_created
      - booking_created
      - operator_requested
  webhook:
    enabled: false
    url: ""
    secret: ""
    events:
      - lead_created
domain_profile:
  type: "medical"
  safety_level: "strict"
