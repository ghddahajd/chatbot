services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chat-widget-backend
    restart: unless-stopped
    ports:
      # 127.0.0.1, не 0.0.0.0 (аудит §2026-08-22): без этого docker публикует порт на всех
      # интерфейсах хоста по умолчанию — обход nginx/TLS целиком (nginx у этого проекта
      # нативный на хосте, не в докере, см. deploy/nginx.chat-widget.example.conf). Origin-
      # проверка в widget.py это заголовок, который клиент сам присылает — curl её обходит
      # тривиально, это не защита от прямого доступа к порту.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      RAG_CHUNKS_FILE: /client-input/normalized/rosh_articles/crawl/chunks.corpus.jsonl
      # /app/data — уже смонтирован из ./backend/data (см. volumes ниже), переживает
      # рестарт контейнера. Задаём именно тут (не в .env), потому что "/app/..." — это
      # путь ВНУТРИ контейнера и ломает native-запуски (скрипты/тесты вне docker), которые
      # тоже читают .env.
      SESSION_SNAPSHOT_FILE: /app/data/session_snapshot.json
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
      - ./widget:/app/widget
      - ./demo:/app/demo
      - ./client-input:/client-input:ro
    # Дефолтный docker-логдрайвер json-file без лимита пишет access-log uvicorn на КАЖДЫЙ
    # чат-запрос в stdout без ограничения — реальный риск забить диск на 50ГБ тарифе со
    # временем (аудит §2026-08-22). max-size×max-file — общий потолок на инстанс, не на файл.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 2GB — половина от 4ГБ хоста (MSK 50), с запасом для ОС/докер-демона/будущих сервисов.
    # Сам бэкенд лёгкий (FastAPI + RAG-индекс 1236 чанков + словари pymorphy2/natasha), но
    # без потолка утечка памяти (например при переиндексации RAG на рестарте) уводит в OOM
    # весь хост, а не только контейнер — можно поднять, если реально не хватит.
    mem_limit: 2g
    healthcheck:
      # python, не curl — curl не установлен в образе (см. Dockerfile), тянуть его только
      # ради healthcheck не хотелось. 200/207 (degraded, но отвечает) — здоров для докера,
      # падает только на 503 (urlopen кидает HTTPError → ненулевой exit).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
