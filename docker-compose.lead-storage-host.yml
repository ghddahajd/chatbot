# Server overlay for the existing loopback-only PostgreSQL container.
services:
  backend:
    image: chatbot-backend-postgres:local
    network_mode: host
    ports: !reset []
    build:
      target: client-access
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    environment:
      LEAD_STORAGE_BACKEND: postgres
      LEAD_DATABASE_URL: ""
      LEAD_PGHOST: 127.0.0.1
      LEAD_PGPORT: "5432"
      LEAD_PGUSER: chatbot_lead_runtime
      LEAD_PGPASSWORD: ${LEAD_DB_PASSWORD:?Задайте пароль роли заявок}
      LEAD_PGDATABASE: chatbot_storage
      DELIVERY_RETRY_ENABLED: "true"
