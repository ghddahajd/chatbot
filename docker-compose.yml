services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chat-widget-backend
    restart: unless-stopped
    # Явная гарантия вместо неявного дефолта Docker (10s) — на выключении lifespan отменяет
    # 5 фоновых тасков (быстро) и делает финальный snapshot_to() сессий (обычно тоже быстро,
    # но зависит от их числа на момент рестарта). 30s даёт запас, не рискуя SIGKILL посреди
    # записи снапшота при редком всплеске активности.
    stop_grace_period: 30s
    # bridge локально (Docker Desktop на Mac не умеет нормально host-режим), host на реальном
    # сервере — там Docker-мост по умолчанию IPv4-only, а Telegram Bot API частично заблокирован
    # по IPv4 в РФ-датацентрах, тогда как у самого хоста рабочий IPv6 (живой баг, 2026-08-25:
    # telegram_bridge стабильно ловил ConnectTimeout/"Network unreachable" именно из контейнера,
    # хотя curl с хоста по IPv6 подключался нормально). DOCKER_NETWORK_MODE=host — задаётся
    # только в серверном .env, не в примере/локально.
    network_mode: ${DOCKER_NETWORK_MODE:-bridge}
    # С host-сетью "0.0.0.0" внутри контейнера — это буквально 0.0.0.0 хоста (нет отдельного
    # network namespace), что публикует порт 8000 на публичном IP в обход nginx — та самая
    # дыра, которую port-mapping ниже нарочно закрывал. UVICORN_HOST=127.0.0.1 на сервере
    # держит тот же периметр, что и раньше, просто другим способом (bind вместо port-mapping).
    command: ["uvicorn", "app.main:app", "--host", "${UVICORN_HOST:-0.0.0.0}", "--port", "8000"]
    ports:
      # В host-режиме этот блок Docker Compose просто игнорирует (с предупреждением) — не
      # мешает, но и не даёт защиты сам по себе в этом режиме, см. UVICORN_HOST выше.
      # 127.0.0.1, не 0.0.0.0 (аудит §2026-08-22): без этого docker публикует порт на всех
      # интерфейсах хоста по умолчанию — обход nginx/TLS целиком (nginx у этого проекта
      # нативный на хосте, не в докере, см. deploy/nginx.chat-widget.example.conf). Origin-
      # проверка в widget.py это заголовок, который клиент сам присылает — curl её обходит
      # тривиально, это не защита от прямого доступа к порту.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      RAG_CHUNKS_FILE: /client-input/normalized/rosh_articles/crawl/chunks.corpus.jsonl
      # /app/data — уже смонтирован из ./backend/data (см. volumes ниже), переживает
      # рестарт контейнера. Задаём именно тут (не в .env), потому что "/app/..." — это
      # путь ВНУТРИ контейнера и ломает native-запуски (скрипты/тесты вне docker), которые
      # тоже читают .env.
      SESSION_SNAPSHOT_FILE: /app/data/session_snapshot.json
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
      - ./widget:/app/widget
      - ./demo:/app/demo
      # НЕ :ro — на сервере (CLIENT_DATA_DEPLOY_KEY задан) docker-entrypoint.sh сам пишет сюда
      # RAG-корпус из приватного репо (rag_corpus/* -> /client-input/*, см. entrypoint). Локально
      # этот код не выполняется (ключ пуст, entrypoint "skipping"), так что права на запись
      # тут ничего не портят — ./client-input и так уже реальные данные, никто их не трогает.
      - ./client-input:/client-input
    # Дефолтный docker-логдрайвер json-file без лимита пишет access-log uvicorn на КАЖДЫЙ
    # чат-запрос в stdout без ограничения — реальный риск забить диск на 50ГБ тарифе со
    # временем (аудит §2026-08-22). max-size×max-file — общий потолок на инстанс, не на файл.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 2GB — половина от 4ГБ хоста (MSK 50), с запасом для ОС/докер-демона/будущих сервисов.
    # Сам бэкенд лёгкий (FastAPI + RAG-индекс 1236 чанков + словари pymorphy2/natasha), но
    # без потолка утечка памяти (например при переиндексации RAG на рестарте) уводит в OOM
    # весь хост, а не только контейнер — можно поднять, если реально не хватит.
    mem_limit: 2g
    healthcheck:
      # python, не curl — curl не установлен в образе (см. Dockerfile), тянуть его только
      # ради healthcheck не хотелось. 200/207 (degraded, но отвечает) — здоров для докера,
      # падает только на 503 (urlopen кидает HTTPError → ненулевой exit).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
